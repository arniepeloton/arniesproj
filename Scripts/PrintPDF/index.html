    <script type="text/javascript">
        function CreateAndDownloadPDF(data, filename) {
            var pdf = new jsPDF('p', 'pt', 'legal');
            // source can be HTML-formatted string, or a reference
            // to an actual DOM element from which the text will be scraped.
            //source = $('#customers')[0];

            // we support special element handlers. Register them with jQuery-style 
            // ID selector for either ID or node name. ("#iAmID", "div", "span" etc.)
            // There is no support for any other type of selectors 
            // (class, of compound) at this time.
            specialElementHandlers = {
                // element with id of "bypass" - jQuery style selector
                '#bypassme': function (element, renderer) {
                    // true = "handled elsewhere, bypass text extraction"
                    return true
                }
            };
            margins = {
                top: 80,
                bottom: 60,
                left: 40,
                width: 535 //522
            };
            // all coords and widths are in jsPDF instance's declared units
            // 'inches' in this case
            //GetUrlParameters().data, // HTML string or DOM elem ref.

            pdf.fromHTML(
            data, // HTML string or DOM elem ref.
            margins.left, // x coord
            margins.top, { // y coord
                'width': margins.width, // max width of content on PDF
                'elementHandlers': specialElementHandlers
            },

            function (dispose) {
                // dispose: object with X, Y of the last line add to the PDF 
                //          this allow the insertion of new lines after html
                //pdf.save(GetUrlParameters().filename + '.pdf');
                Android.AddLog('ok pa dire 3');
                pdf.save(filename + '.pdf');
                //pdf.output("dataurlnewwindow");
            }, margins);
        }

        function GetUrlParameters(vUrl) {
            // PARAMS:
            //  vUrl: [optional]

            vUrl = vUrl || window.location.search.substring(1);
            var urlParams = {};
            var match,
        pl = /\+/g,  // Regex for replacing addition symbol with a space
        search = /([^&=]+)=?([^&]*)/g,
        decode = function (s) { return decodeURIComponent(s.replace(pl, " ")); },
        query = vUrl;

            while (match = search.exec(query))
                urlParams[decode(match[1])] = decode(match[2]);

            return urlParams;

        }

        function asd(vUrl) {
            return 'asd';
        }
    </script>
