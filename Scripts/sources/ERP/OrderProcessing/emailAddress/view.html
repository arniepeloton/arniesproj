<div idx="popReprintRequest" class="modal fade" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Email Addresses</h5>
                <button data-role="none" type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
            </div>
            <div class="modal-body">
                <table></table>
                <p name="lblResult"></p>
                <p name="lblMessage">Enter email address:</p>
                <span>(Please separate multiple email addresses with a comma. Ex. sample1@email.com, sample2@email.com)</span>
                <div>
                    <textarea name="txtData" style="width:467px;height:97px" class="form-control"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <div class="row">
                    <div class="col">
                        <button data-role="none" name="butCancel" class="btn btn-secondary btn-block">Close</button>
                    </div>
                    <div class="col">
                        <button data-role="none" name="butOk" class="btn btn-success btn-block">Save</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
