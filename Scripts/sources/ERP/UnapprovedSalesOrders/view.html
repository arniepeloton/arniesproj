            <div class="modal-header">
                <h5 class="modal-title">Unapproved Sales Orders</h5>
                <button data-role="none" type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
            </div>
            <div class="modal-body">
                
            </div>

<div id="popupUnapprovedSalesOrders" custom-data-role="popup">
    <div class="popup">
        <div class="popup-header">
            Unapproved Sales Orders
            <a class="popup-close">x</a>
        </div>

        <div class="popup-content">
            <div class="mb-3" style="display: inline-flex;">
                <label for="selUnapprovedOrdersStatus" style="padding-top: 6px;padding-right: 10px;">Approval Status:</label>
                <select name="selUnapprovedOrdersStatus" id="selUnapprovedOrdersStatus" class="form-select fixed mr-3">
                    <option value="">Unapproved Orders</option>
                    <option value="approved">Approved Orders</option>
                    <option value="disapproved">Disapproved Orders</option>
                </select>

                <span class="ml-3" style="padding-top: 6px;padding-right: 10px;">Transaction Type:</span>
                <select id="selUnapprovedOrdersTransactionType" class="form-select fixed mr-3">
                    <option value="so">Show SOs Only</option>
                    <option value="invoices">Show Invoices Only</option>
                    <option value="po">Show POs Only</option>
                    <option>Show SOs, Invoices, and POs</option>
                </select>
                <button name="butRefreshUnapprovedOrders" class="btn btn-default btn-secondary">Refresh</button>
            </div>
            
            <div name="divUnapprovedOrders" custom-tab-role="content" style="display: block; overflow:auto;">
                <table name="tableUnapprovedOrders" data-role="table" data-mode="reflow" style="margin-right: 5px; display: table;" class="ui-table ui-responsive table-stroke table-stripe custom-tbl-responsive table table-light table-hover table-striped">
                    <thead>
                        <tr class="custom-theme-f fixed-cell-width">
                            <th class="txt-center"> Customer Name </th>
                            <th class="txt-center"> Order No. </th>
                            <th class="txt-center"> Order Date </th>
                            <th name="thServedQty" class="txt-center"> Order Amount </th>
                            <th class="txt-center"> Requested By </th>
                            <th class="txt-center"> Unapproved Reason </th>
                            <th class="txt-center"> Status </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr name="data" class="fixed-cell-width">
                            <td name="CustomerName" class="txt-center-x"> SKU # </td>
                            <td name="OrderNum" class="txt-center"> Product Description </td>
                            <td name="OrderDate" class="txt-center"> Order Qty </td>
                            <td name="OrderAmount" class="txt-center"> </td>
                            <td name="RequestedBy" class="txt-center"> Packing Size </td>
                            <td name="UnapprovedReason" class="txt-center"> Unit Price </td>
                            <td name="Status" class="txt-center"> Unapproved </td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr name="data" class="fixed-cell-width">
                            <td name="CustomerName" class="txt-center"> </td>
                            <td name="OrderNum" class="txt-center">  </td>
                            <td name="OrderDate" class="txt-center">  </td>
                            <td name="OrderAmount" class="txt-center"> </td>
                            <td name="RequestedBy" class="txt-center"> </td>
                            <td name="UnapprovedReason" class="txt-center">  </td>
                            <td name="Status" class="txt-center">  </td>
                        </tr>
                    </tfoot>
                </table>

            </div>

        </div>

        <div class="popup-footer align-right">
            <button id="" data-role="none" class="btn custom-btn-theme-c btnCircle popup-close">
                <img alt="Options" src="/Content/images/close-black.png" />
            </button>
        </div>
    </div>
</div>
