<style type="text/css">
    .players {
        border: 2px solid #28a745;
        background-color: #c1ffd0;
        border-radius: 3px;
    }

    .players-warning {
        border: 2px solid #ffc107 !important;
        background-color: #ffefc0  !important;
    }

    .players-done {
        border: 2px solid #dc3545 !important;
        background-color: #ffc6cb  !important;
    }

<div class="row align-items-center mb-3">
    <div class="col-sm-6">
        Date:
        <button data-role="none" name="btnDateReport" class="btn btn-secondary ml-3">Today</button>

    <div class="col-sm-6">

                <th style="min-width:180px;">Representative Name</th>

                <th style="min-width:150px;">Entry Time</th>
