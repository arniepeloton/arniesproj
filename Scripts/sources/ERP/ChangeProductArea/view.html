<div id="pageChangeProductArea" style="display:block;">
    <h1 class="display-6 mb-4">Change Product Area Or Section</h1>

    <div data-role="content">
        <ul class="nav nav-tabs">
            <li class="nav-item">
                <a class="nav-link active" data-toggle="tab" href="#tabChangeProductAreaParameters">Parameters</a>
            </li>
            <li>
                <a class="nav-link" data-toggle="tab" href="#tabChangeProductAreaBrands">Brands</a>
            </li>
            <li>
                <a class="nav-link" data-toggle="tab" href="#tabChangeProductAreaCategories">Categories</a>
            </li>
            <li>
                <a class="nav-link" data-toggle="tab" href="#tabChangeProductAreaProducts">Products</a>
            </li>
        </ul>
        <div class="tab-content">
            <div id="tabChangeProductAreaParameters" class="tab-pane fade show active pt-3">
                <div class="row mb-3">
                    <label class="col-sm-2 mb-3 col-form-label" for="butNewArea">What will be the new area or section?</label>
                    <div class="col-sm-10">
                        <button name="butNewArea" data-role="none" class="btn btn-secondary btn-block">Select</button>
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-2 mb-3 col-form-label" for="butNewArea">Filtering method:</label>
                    <div class="col-sm-10">
                        <select name="cbPriceAdjustmentMethod" data-role="none" class="form-select">
                            <option value="or">Either Brand Or Category Must Match</option>
                            <option value="and">Both Brand And Category Must Match</option>
                        </select>
                    </div>
                </div>

                <div class="mt-4 text-center">
                    <button name="butNext" data-role="none" class="btn btn-success btn-lg">Next</button>
                </div>
            </div>
            <div id="tabChangeProductAreaBrands" class="tab-pane fade pt-3">
                <h5 class="mb-3">Which product brands do you want to apply this area or section adjustment to?</h5>

                <div name="divProductBrands" class="mb-3"></div>

                <div class="mt-4 text-center">
                    <button name="butBrandNext" data-role="none" class="btn btn-success btn-lg">Next</button>
                </div>
            </div>
            <div id="tabChangeProductAreaCategories" class="tab-pane fade pt-3">
                <h5 class="mb-3">Which product categories do you want to apply this area or section adjustment to?</h5>

                <div name="divProductCategories" class="mb-3"></div>

                <div class="mt-4 text-center">
                    <button name="butCategoryNext" data-role="none" class="btn btn-success btn-lg">Next</button>
                </div>
            </div>
            <div id="tabChangeProductAreaProducts" class="tab-pane fade pt-3">
                <table name="tableProducts" data-role="none" class="table table-striped table-hover display mb-3"></table>

                <div class="row mb-3">
                    <div class="offset-sm-3 col-sm-3">
                        <button name="butCheckAll" data-role="none" class="btn btn-outline-secondary btn-block">Check All</button>
                    </div>
                    <div class="col-sm-3">
                        <button name="butCheckNone" data-role="none" class="btn btn-outline-secondary btn-block">Check None</button>
                    </div>
                </div>

                <div class="mt-4 text-center">
                    <button name="butSave" data-role="none" class="btn btn-success btn-lg">Save</button>
                </div>
            </div>
        </div>
    </div>
</div>
