<div class="container-fluid mb-5">

                    <button data-role="none" id="btnAddContract" class="btn btn-success">Add Contract</button>

                        <thead>

                                <th class="custom-theme-f txt-center"> Template Name</th>
                                <th class="custom-theme-f txt-center"> Module </th>
                                <th class="custom-theme-f txt-center" style="min-width:85px;"> Last Modified By </th>

                </div>
            </div>

            <div id="divNewContractDesigner" subpage="divErpContractDesigner" style="display:none;">

                    <div class="col-sm-4">

                        <input type="text" id="txtContractTemplateName" data-role="none" class="form-control" />
                    </div>
                    <div class="col-sm-4">

                        <select data-role="none" id="selContractModule" class="form-select"></select>
                    </div>
                </div>

        <br />-->

                <div style="margin-bottom:5rem;"></div>
                <div style="position:fixed; bottom:20px; width:100%; text-align:center;">
                    <button data-role="none" title="Based on selected module" class="btn btn-secondary btn-lg" id="btnCancelContract" style="margin-right:10px;">Cancel</button>
                    <button data-role="none" title="Based on selected module" class="btn btn-success btn-lg" id="btnAddFields" style="margin-right:10px;">Add Fields</button>
                    <button data-role="none" id="btnExport" class="btn btn-primary btn-lg" style="margin-right:10px;">Show Preview</button>
                    <button data-role="none" id="btnSaveContract" class="btn btn-danger btn-lg" style="margin-right:10px;">
                        Save Template
                    </button>
                </div>
            </div>
        </div>

        </div>
