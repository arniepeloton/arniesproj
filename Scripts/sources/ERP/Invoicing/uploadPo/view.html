<div id="popNewOutlet" class="modal fade" tabindex="-1" idx="popOrderInput">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <form>
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" name="title">Import PO From Xml File</h5>
                    <button data-role="none" type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                </div>
                <div class="modal-body">
                    <div class="row mb-3">
                        <label class="col-sm-3 mb-3" for="fileTemplate">Xml File:</label>
                        <div class="col-sm-9">
                            <input data-role="none" name="fileTemplate" type="file" class="form-control" accept=".xml" />
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <div class="row">
                        <div class="col-6">
                            <button data-role="none" type="button" class="btn btn-secondary btn-lg btn-block" data-dismiss="modal">Cancel</button>
                        </div>
                        <div class="col-6">
                            <button data-role="none" type="submit" class="btn btn-success btn-lg btn-block">Save</button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
