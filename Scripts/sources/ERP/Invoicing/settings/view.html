<div class="row wrapper min-vh-100 flex-column flex-md-row">
    <div class="col-12 col-md-2 p-0 bg-light flex-shrink-1 mb-3">
        <nav class="navbar navbar-expand-sm navbar-light bg-light align-items-start flex-md-column flex-row p-2">
            <a data-role="none" class="navbar-brand" href="#">Menu</a>
            <a data-role="none" href="#" class="navbar-toggler" data-toggle="collapse" data-target=".sidebarDS">
                <span class="navbar-toggler-icon"></span>
            </a>
            <div class="collapse navbar-collapse sidebarDS mt-2">
                <ul class="flex-column w-100 justify-content-between nav nav-pills">
                    <li><a class="nav-link active" role="button" data-role="none" data-toggle="tab" href="#tabInvoiceSettingsGeneral">General Settings</a></li>
                    <li><a class="nav-link" role="button" id="btnDSRemarksMessages" data-role="none" data-toggle="tab" href="#tabInvoiceSettingsGPM">GPM / Discount Thresholds per Category</a></li>
                    <li><a class="nav-link" role="button" id="btnDSRemarksMessages" data-role="none" data-toggle="tab" href="#tabInvoiceSettingsDocumentTypes">Document Types</a></li>
                    <li><a class="nav-link" role="button" id="btnDSRemarksMessages" data-role="none" data-toggle="tab" href="#tabInvoiceSettingsAutoCreate">Auto Create Invoice</a></li>
                    <li><a class="nav-link" role="button" id="btnDSRemarksMessages" data-role="none" data-toggle="tab" href="#tabInvoiceSettingsAutoPrint">Auto Print Invoice</a></li>
                </ul>
            </div>
        </nav>
    </div>

    <div class="col bg-faded">
        <div class="tab-content p-3">
            <div class="tab-pane fade active show" id="tabInvoiceSettingsGeneral">
                <div class="mb-3 row">
                    <label class="col-md-4">Allow direct invocing? (If this is disabled, all orders need to be initiated by a sales order transaction first.)</label>
                    <div class="col-md">
                        <input type="checkbox" name="AllowEncodingOfQuantitiesInInvoice" class="form-check-input" />
                    </div>
                </div>

                <div class="mb-3 row">
                    <label class="col-md-4">Free Type A Price Minimum Line GPM (Gross Profit Margin): <span class="required">*</span></label>
                    <div class="col-md">
                        <input id="txtFreeTypeAPriceMinimumGpm" name="txtFreeTypeAPriceMinimumGpm" data-role="none" type="text" class="form-control" style="width: 70px; display: inline" /><span>&nbsp;%</span>
                    </div>
                </div>

                <div class="mb-3 row">
                    <label class="col-md-4">Set all customers to have unlimited credit limit</label>
                    <div class="col-md">
                        <select class="form-select fixed" id="selUnlimitedCredit">
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="tabInvoiceSettingsGPM">
                <div name="divCategoryGpmPlaceholder" class="mb-3"></div>
            </div>

            <div class="tab-pane fade" id="tabInvoiceSettingsDocumentTypes">
                <div class="text-right mb-3">
                    <button data-role="none" name="butAddDocumentType" class="btn btn-secondary">Add document type</button>
                </div>

                <div style="overflow: auto;">
                    <table name="tableDocumentControl" data-role="none" style="margin-right: 5px; display: table;" class="table table-light table-striped table-hover">
                        <thead>
                            <tr class="custom-theme-f fixed-cell-width">
                                <th class="txt-center"> Document Name </th>
                                <th class="txt-center"> Module Source </th>
                                <th class="txt-center"> Print Limit </th>
                                <th class="txt-center"> No. of Copies per Print </th>
                                <th class="txt-center"> Label of Copies </th>
                                <th class="txt-center"> Active </th>
                                <th class="txt-center"> Print Automatically </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr name="data" class="fixed-cell-width">
                                <td name="DocumentName" class="txt-center"></td>
                                <td name="ModuleSource" class="txt-center"></td>
                                <td name="PrintLimit" class="txt-center"></td>
                                <td name="CopiesPerPrint" class="txt-center"></td>
                                <td name="LabelOfCopies" class="txt-center"></td>
                                <td name="Active" class="txt-center"></td>
                                <td name="PrintAutomatically" class="txt-center"></td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr name="data" class="fixed-cell-width"></tr>
                        </tfoot>
                    </table>
                </div>
            </div>

            <div class="tab-pane fade" id="tabInvoiceSettingsAutoCreate">
                <div name="divAutoCreateInvoice"></div>
            </div>

            <div class="tab-pane fade" id="tabInvoiceSettingsAutoPrint">
                <div name="divAutoPrintInvoice" class="mb-3"></div>
            </div>
        </div>

        <div class="text-center mt-3 mb-3">
            <button data-role="none" name="butSave" class="btn btn-success btn-lg">Save Settings</button>
        </div>
    </div>
</div>
