<div id="popShowInventoryColumns-bs" data-backdrop="static" class="modal fade" tabindex="-1" style="display:none;">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Quantity Display Options</h5>
                <button data-role="none" type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
            </div>
            <div class="modal-body">
                <div class="mb-4">
                    Would you like to display quantity information?
                    Please select the type of quantities you want displayed.
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="chkShowInventoryColumnsQuantityOnHand">
                    <label class="form-check-label" for="chkShowInventoryColumnsQuantityOnHand">
                        Quantity On Hand
                    </label>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="chkShowInventoryColumnsQuantityCommitted">
                    <label class="form-check-label" for="chkShowInventoryColumnsQuantityCommitted">
                        Quantity Committed
                    </label>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="chkShowInventoryColumnsQuantityAvailableToCommit">
                    <label class="form-check-label" for="chkShowInventoryColumnsQuantityAvailableToCommit">
                        Quantity Available to Commit
                    </label>
                </div>

                <div class="row">
                    <div class="col-sm-6">
                        <a data-role="none" href="#" data-rel="back" data-dismiss="modal" class="btn custom-btn-theme-c btn-secondary btn-lg btn-block">Close</a>
                    </div>
                    <div class="col-sm-6">
                        <button data-role="none" id="butShowInventoryColumnsOk" class="btn custom-btn-theme-b btn-success btn-lg btn-block">Ok</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
