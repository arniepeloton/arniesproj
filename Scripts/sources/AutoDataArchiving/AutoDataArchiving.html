
<div class="container-fluid">
    <h1 class="display-6 mb-4">Auto Data Archiving</h1>

    <div class="row mb-3">
        <label class="col-sm-3 mb-3 col-form-label" for="">
            Archive data that are older than X years:
        </label>
        <div class="col-sm-9">
            <input data-role="none" name="txtYears" type="text" class="form-control mb-2">
            <button name="butComputeYears" data-role="none" class="btn btn-secondary btn-block">Compute</button>
        </div>
    </div>

    <div class="row mb-3">
        <label class="col-sm-3 mb-3 col-form-label" for="">
            Archive data that are older than this date:
        </label>
        <div class="col-sm-9">
            <button name="butCalendar" data-role="none" class="btn btn-secondary btn-block">Choose a date</button>
        </div>
    </div>

    <div class="row mb-3">
        <div class="offset-sm-3 col-sm-9">
            <button data-role="none" name="butArchiveNow" class="btn btn-success btn-block">Archive Now</button>
        </div>
    </div>
</div>
