<div class="modal fade">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <!--<a href="#" data-rel="back" data-role="button" data-theme="a" data-icon="delete" data-iconpos="notext" class="ui-btn-right">Close</a>-->
            <div class="modal-header">
                <h5 class="modal-title">Save As</h5>
                <button data-role="none" type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
            </div>
            <div class="modal-body">
                <div name="divResult" class="text-danger text-center">

                </div>
                <div class="mb-3">
                    <label class="form-label">Product No.: <span class="required">*</span></label>
                    <input name="txtProductNum" data-role="none" class="form-control" />
                </div>
                <div class="mb-3">
                    <label class="form-label">Product Name: <span class="required">*</span></label>
                    <input name="txtProductName" data-role="none" class="form-control" />
                </div>
                <div class="mb-3">
                    <label class="form-label">Brand Name: <span class="required">*</span></label>
                    <input name="txtProductBrand" data-role="none" class="form-control" />
                </div>
                <div class="mb-3">
                    <label class="form-label">This new Product is: <span class="required">*</span></label>
                    <div class="form-check">
                        <input data-role="none" class="form-check-input" name="chbNewProduct" type="radio" value="Direct Competitor" id="chbDirectCompetitor" checked>
                        <label class="form-check-label" for="chbDirectCompetitor">
                            Direct Competitor
                        </label>
                    </div>
                    <div class="form-check">
                        <input data-role="none" class="form-check-input" name="chbNewProduct" type="radio" value="Variant" id="chbVariant">
                        <label class="form-check-label" for="chbVariant">
                            Variant
                        </label>
                    </div>
                    <div class="form-check">
                        <input data-role="none" class="form-check-input" name="chbNewProduct" type="radio" value="Complement" id="chbComplement">
                        <label class="form-check-label" for="chbComplement">
                            Complement
                        </label>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <div class="row">
                    <div class="col-6">
                        <button data-role="none" name="butCancel" type="button" class="btn btn-secondary btn-block btn-lg" data-dismiss="modal">Cancel</button>
                    </div>
                    <div class="col-6">
                        <button data-role="none" name="butOk" type="button" class="btn btn-success btn-block btn-lg">Save</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
