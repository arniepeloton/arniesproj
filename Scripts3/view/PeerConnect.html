<div name="divPeerConnect" data-role="page" data-url="divPeerConnect">
    <div data-role="header">
        <a href="#" data-icon="arrow-l" data-rel="back">Back</a>
        <h1 name="lblPageHeader">Peer Connect</h1>
    </div>
    <div data-role="content">
        <form id="formPeerConnect">
            <div data-role="fieldcontain">
                <label for="cbPeerConnectLocalRole">
                    Role of this device:
                </label>
                <select id="cbPeerConnectLocalRole">
                    <option value="primary">Primary device</option>
                    <option value="customer screen">Customer screen</option>
                    <option value="kitchen">Kitchen screen</option>
                </select>
            </div>
            <button id="butPeerConnectLocalRole">Save local device role </button>
            <hr />
            <div data-role="fieldcontain" style="margin-top:32px">
                <label for="cbPeerConnectRemoteRole">
                    Role of remote device:
                </label>
                <select id="cbPeerConnectRemoteRole">
                    <option value="primary">Primary device</option>
                    <option value="customer screen">Customer screen</option>
                    <option value="kitchen">Kitchen screen</option>
                </select>
            </div>
            <div data-role="fieldcontain">
                <label for="txtPeerConnectServer">
                    IP of remote device:
                </label>
                <input id="txtPeerConnectServer"/>
            </div>
            <button id="butPeerConnectRemoteRole">Save remote device role</button>
        </form>
    </div>
    <div data-role="footer_no_theme">
        <div style="text-align: center; padding-bottom: 15px">

        </div>
    </div>
</div>
